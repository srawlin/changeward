spec:
  inputs:
    version:
      default: latest
      description: Release tag to download, "latest", or "preinstalled" when the job image already has changeward.
    binary-url:
      default: ""
      description: Download the linux tarball from this URL instead of GitHub releases (e.g. a GitLab generic package; CI_JOB_TOKEN is sent to the same instance).
    stage:
      default: test
    postgres-version:
      default: "18"
    synthetic-rows:
      default: "1000"
    environment:
      default: prod
    framework:
      default: ""
    migrations-dir:
      default: ""
    mode:
      default: report
      options: [report, gate, deny-only]
---
changeward-rehearse:
  stage: $[[ inputs.stage ]]
  image: alpine:3.20
  services:
    - name: postgres:$[[ inputs.postgres-version ]]-alpine
      alias: changeward-pg
  variables:
    POSTGRES_PASSWORD: changeward
    CHANGEWARD_REHEARSAL_DSN: postgres://postgres:changeward@changeward-pg:5432/postgres?sslmode=disable
    GIT_DEPTH: "0"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - apk add --no-cache curl git tar coreutils bash >/dev/null
    - |
      arch=$(uname -m); case "$arch" in x86_64) arch=amd64;; aarch64) arch=arm64;; esac
      v="$[[ inputs.version ]]"; u="$[[ inputs.binary-url ]]"
      if [ -n "$u" ]; then
        case "$u" in "$CI_SERVER_URL"/*) curl -fsSL -H "JOB-TOKEN: $CI_JOB_TOKEN" "$u" -o /tmp/cg.tgz ;; *) curl -fsSL "$u" -o /tmp/cg.tgz ;; esac
        tar -xzf /tmp/cg.tgz -C /usr/local/bin changeward
      elif [ "$v" != "preinstalled" ]; then
        if [ "$v" = "latest" ]; then base="https://github.com/srawlin/changeward/releases/latest/download"; else base="https://github.com/srawlin/changeward/releases/download/$v"; fi
        curl -fsSL "$base/changeward_linux_${arch}.tar.gz" -o /tmp/cg.tgz
        curl -fsSL "$base/checksums.txt" -o /tmp/checksums.txt
        (cd /tmp && grep " changeward_linux_${arch}.tar.gz\$" checksums.txt | sed "s| changeward_linux_${arch}.tar.gz| cw.tgz|" | sha256sum -c -)
        tar -xzf /tmp/cg.tgz -C /usr/local/bin changeward
      fi
      changeward version
  script:
    - git fetch --no-tags origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - |
      set +e
      args="--base-ref origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME --env $[[ inputs.environment ]] --synthetic $[[ inputs.synthetic-rows ]] --out changeward-evidence.json"
      [ -n "$[[ inputs.framework ]]" ] && args="$args --framework $[[ inputs.framework ]]"
      [ -n "$[[ inputs.migrations-dir ]]" ] && args="$args --migrations-dir $[[ inputs.migrations-dir ]]"
      changeward rehearse $args > changeward-report.md; code=$?
      cat changeward-report.md
      [ "$code" -gt 1 ] && exit "$code"
      if [ -n "${CHANGEWARD_GITLAB_TOKEN:-}${GITLAB_TOKEN:-}" ]; then changeward report changeward-evidence.json --gitlab --status || true; fi
      gargs=""; [ -n "${CHANGEWARD_GITLAB_TOKEN:-}${GITLAB_TOKEN:-}" ] && gargs="--gitlab"   # MR approvals satisfy "review required"
      changeward gate changeward-evidence.json $gargs; g=$?
      case "$[[ inputs.mode ]]:$g" in
        report:*) exit 0 ;; gate:0) exit 0 ;; gate:*) exit 1 ;; deny-only:3|deny-only:1) exit 1 ;; *) exit 0 ;;
      esac
  artifacts:
    when: always
    paths: [changeward-evidence.json, changeward-report.md]
