# plugins/config.yaml in IBM ContextForge MCP Gateway
plugins:
  - name: "Changeward"
    kind: "changeward_contextforge.plugin.ChangewardPlugin"
    hooks: ["tool_pre_invoke"]
    mode: "enforce"
    priority: 10
    config:
      executor_url: "http://changeward-executor.changeward.svc:8443"
      token_env: CHANGEWARD_GATEWAY_TOKEN
      env: prod
      fail_closed: true
      read_only_tools: ["*-list-*", "*-get-*"]   # globs of tools that only read
