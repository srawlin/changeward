# Envoy HTTP filter: send every MCP request through Changegate before it
# reaches the upstream MCP server. Reads pass; SQL writes to known database
# tools are blocked (use Changegate's own MCP tools); other tool calls are
# decided by policy as approval-only changes and audited.
http_filters:
  - name: envoy.filters.http.ext_authz
    typed_config:
      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
      transport_api_version: V3
      failure_mode_allow: false            # fail closed
      with_request_body:
        max_request_bytes: 1048576
        allow_partial_message: false
      http_service:
        server_uri:
          uri: http://changegate-executor.changegate.svc:8443
          cluster: changegate_executor
          timeout: 2s
        path_prefix: /v1/authz/mcp          # Envoy appends the original path; the executor ignores it
        authorization_request:
          headers_to_add:
            - { key: x-changegate-token, value: "%ENVIRONMENT(CHANGEGATE_GATEWAY_TOKEN)%" }
            - { key: x-changegate-server, value: postgres-mcp }
            - { key: x-changegate-env, value: prod }
        authorization_response:
          allowed_client_headers:
            patterns: [{ exact: x-changegate-decision }]
  - name: envoy.filters.http.router
    typed_config: { "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router }
