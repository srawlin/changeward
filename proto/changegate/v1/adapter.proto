// Changegate adapter protocol, v0.
//
// Adapters run out of process and are launched by the executor over
// hashicorp/go-plugin (gRPC transport). An adapter declares which of the
// optional RPCs it implements in AdapterInfo.capabilities; the executor never
// calls an RPC that was not declared.
syntax = "proto3";

package changegate.v1;

option go_package = "github.com/srawlin/changegate/gen/changegate/v1;changegatev1";

// Reversibility class of a change. Drives policy.
enum Reversibility {
  REVERSIBILITY_UNSPECIFIED = 0;
  // An exact undo exists and has been (or can be) exercised.
  REVERSIBLE = 1;
  // A semantic undo exists (refund, recreate with a new ID, re-apply prior config).
  COMPENSATABLE = 2;
  // Undo only by restoring a checkpoint or snapshot.
  CHECKPOINT_ONLY = 3;
  // No undo (sent email, destroyed data with no snapshot).
  IRREVERSIBLE = 4;
}

enum Access {
  ACCESS_UNSPECIFIED = 0;
  READ = 1;
  WRITE = 2;
  DESTRUCTIVE = 3;
}

// A connection to one target system. Config carries adapter-specific
// connection details (for Postgres: dsn). Env is the environment class:
// personal, shared-dev, staging, prod, prod-restricted.
message Target {
  string name = 1;
  string adapter = 2;
  string env = 3;
  map<string, string> config = 4;
}

// One intended mutation (or read) of one target.
message Operation {
  // Adapter-defined kind, e.g. "sql".
  string kind = 1;
  // The operation itself, e.g. SQL text.
  string payload = 2;
  map<string, string> params = 3;
  // Free-text intent supplied by the agent or human.
  string intent = 4;
}

message StatementClass {
  string text = 1;
  // Statement kind, e.g. "UPDATE", "ALTER TABLE", "CREATE INDEX".
  string kind = 2;
  Access access = 3;
  // Objects touched, schema-qualified where known.
  repeated string objects = 4;
  // Risk flags, e.g. "delete-without-where", "non-concurrent-index".
  repeated string flags = 5;
}

message Classification {
  Access access = 1;
  repeated StatementClass statements = 2;
  repeated string objects = 3;
  repeated string flags = 4;
}

message Effect {
  // e.g. "rows-updated", "column-added", "lock", "table-rewrite".
  string kind = 1;
  string object = 2;
  string description = 3;
  int64 rows = 4;
}

// An adapter-computed effect preview. hash is a content hash over every field
// that affects what apply will do; approvals bind to it.
message Plan {
  string id = 1;
  string hash = 2;
  string adapter = 3;
  string target = 4;
  string env = 5;
  Operation operation = 6;
  Classification classification = 7;
  repeated Effect effects = 8;
  Reversibility reversibility = 9;
  bool destructive = 10;
  int64 blast_rows = 11;
  repeated string warnings = 12;
  // Adapter facts used by policy, e.g. lock_modes, rewrite.
  map<string, string> facts = 13;
  // Human-readable diff, already redacted for display.
  string diff = 14;
  // Hash of the state the plan assumes (e.g. before-images).
  string precondition_hash = 15;
  // How the plan was rehearsed: "live-dry-run", "static", "T0".."T3".
  string rehearsal_tier = 16;
  // Opaque adapter data needed by apply (JSON).
  bytes adapter_data = 17;
  string created_at = 18;
  string expires_at = 19;
}

// What actually happened at apply time, plus the undo handle.
message Receipt {
  string id = 1;
  string plan_hash = 2;
  string applied_at = 3;
  string output = 4;
  int64 rows_affected = 5;
  // Opaque adapter undo handle (JSON): before-images, prior definitions, trash names.
  bytes undo_handle = 6;
  Reversibility reversibility = 7;
  repeated string warnings = 8;
}

message Check {
  string name = 1;
  bool passed = 2;
  string detail = 3;
}

message Verification {
  bool passed = 1;
  repeated Check checks = 2;
}

message RehearsalResult {
  bool passed = 1;
  string tier = 2;
  repeated Check checks = 3;
  repeated Effect effects = 4;
  string report = 5;
}

message AdapterInfo {
  string name = 1;
  string version = 2;
  repeated string kinds = 3;
  // Subset of: classify, plan, apply, verify, undo, rehearse, checkpoint, restore, provision_copy.
  repeated string capabilities = 4;
}

message DescribeRequest {}

message ClassifyRequest {
  Target target = 1;
  Operation operation = 2;
}

message PlanRequest {
  Target target = 1;
  Operation operation = 2;
}

message RehearseRequest {
  // A production-like copy, provisioned by ProvisionCopy or the caller.
  Target copy = 1;
  Operation operation = 2;
}

message ApplyRequest {
  Target target = 1;
  Plan plan = 2;
}

message VerifyRequest {
  Target target = 1;
  Plan plan = 2;
  Receipt receipt = 3;
}

message UndoRequest {
  Target target = 1;
  Plan plan = 2;
  Receipt receipt = 3;
}

message CheckpointRequest {
  Target target = 1;
  string label = 2;
}

message CheckpointRef {
  string id = 1;
  string adapter = 2;
  string target = 3;
  bytes data = 4;
  string created_at = 5;
}

message RestoreRequest {
  Target target = 1;
  CheckpointRef checkpoint = 2;
}

message CopyRequest {
  Target target = 1;
  string name = 2;
}

message CopyRef {
  Target target = 1;
  bytes data = 2;
}

message ReleaseCopyRequest {
  CopyRef copy = 1;
}

message ReleaseCopyResponse {}

service Adapter {
  rpc Describe(DescribeRequest) returns (AdapterInfo);
  rpc Classify(ClassifyRequest) returns (Classification);
  rpc Plan(PlanRequest) returns (.changegate.v1.Plan);
  rpc Rehearse(RehearseRequest) returns (RehearsalResult);
  rpc Apply(ApplyRequest) returns (Receipt);
  rpc Verify(VerifyRequest) returns (Verification);
  rpc Undo(UndoRequest) returns (Receipt);
  rpc Checkpoint(CheckpointRequest) returns (CheckpointRef);
  rpc Restore(RestoreRequest) returns (Receipt);
  rpc ProvisionCopy(CopyRequest) returns (CopyRef);
  rpc ReleaseCopy(ReleaseCopyRequest) returns (ReleaseCopyResponse);
}
