name: changegate-selftest
on:
  pull_request:
    paths: ["examples/migrations/**", "integrations/github-action/**", "cmd/**", "adapters/**", "internal/**"]
permissions:
  contents: read
  pull-requests: write
  statuses: write
jobs:
  rehearse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: cg
        uses: ./integrations/github-action
        with:
          version: local
          migrations-dir: examples/migrations
          synthetic-rows: "500"
          mode: report
      - run: echo "decision=${{ steps.cg.outputs.decision }} approvers=${{ steps.cg.outputs.approvers }}"
