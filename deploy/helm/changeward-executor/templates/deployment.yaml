apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cw.name" . }}
  labels: {{- include "cw.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: changeward-executor, app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      labels: {{- include "cw.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ printf "%s\n%s" .Values.config .Values.policy | sha256sum }}
    spec:
      serviceAccountName: {{ include "cw.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.rbac.kubernetes.enabled }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: executor
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["executor", "serve", "--addr", "0.0.0.0:8443"]
          env:
            - { name: CHANGEWARD_CONFIG, value: /etc/changeward/changeward.yaml }
            - { name: CHANGEWARD_STORE, value: /data/changeward.db }
            - { name: HOME, value: /tmp }   # kubectl and git need a writable home (read-only root filesystem)
          {{- if .Values.existingSecret }}
          envFrom:
            - secretRef: { name: {{ .Values.existingSecret }} }
          {{- end }}
          ports: [{ name: http, containerPort: 8443 }]
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 20 }
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /etc/changeward, readOnly: true }
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          configMap: { name: {{ include "cw.name" . }} }
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim: { claimName: {{ include "cw.name" . }} }
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
