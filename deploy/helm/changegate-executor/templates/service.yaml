apiVersion: v1
kind: Service
metadata:
  name: {{ include "cg.name" . }}
  labels: {{- include "cg.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: { app.kubernetes.io/name: changegate-executor, app.kubernetes.io/instance: {{ .Release.Name }} }
  ports: [{ name: http, port: {{ .Values.service.port }}, targetPort: http }]
